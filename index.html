<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crescent City Weather</title>

<style>
  :root{
    --blue:#3855d3;
    --bg:#050A14;
    --text:#ffffff;
    --muted:rgba(255,255,255,0.84);
    --card:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.16);
    --yellow:#ffc42e;
    --cyan:#22d3ee;
    --snow:#67e8f9;
    --danger:#ffb020;
  }

  *{ box-sizing:border-box }

  html,body{
    margin:0;
    width:1200px;
    height:2160px;
    overflow:hidden;
    background:var(--bg);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }

  body{
    display:grid;
    place-items:center;
    color:var(--text);
    position:relative;
  }

  body::before{
    content:"";
    position:absolute;
    inset:-20%;
    background:radial-gradient(
      circle at center,
      rgba(56,85,211,0.24),
      rgba(56,85,211,0.10) 42%,
      transparent 70%
    );
    pointer-events:none;
  }

  main{
    position:relative;
    width:100%;
    height:100%;
    padding:90px 82px 170px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:20px;
  }

  .header{
    text-align:center;
  }

  .location{
    font-size:54px;
    font-weight:900;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }

  .sub{
    margin-top:14px;
    font-size:32px;
    font-weight:700;
    color:var(--muted);
  }

  .current{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:18px;
    min-height:710px;
  }

  .weather-icon{
    width:300px;
    height:300px;
    display:grid;
    place-items:center;
    overflow:visible;
    filter:drop-shadow(0 24px 45px rgba(0,0,0,0.65));
  }

  .weather-icon svg{
    width:100%;
    height:100%;
    overflow:visible;
  }

  .temp{
    font-size:200px;
    font-weight:950;
    line-height:0.88;
    letter-spacing:-0.06em;
    text-shadow:
      0 14px 38px rgba(0,0,0,0.70),
      0 0 22px rgba(56,85,211,0.38);
  }

  .condition{
    max-width:1000px;
    font-size:54px;
    font-weight:900;
    line-height:1.08;
    color:var(--text);
  }

  .details{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
  }

  .card{
    min-height:130px;
    padding:20px 34px;
    border-radius:32px;
    background:var(--card);
    border:1px solid var(--border);
    box-shadow:0 18px 45px rgba(0,0,0,0.34);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:28px;
  }

  .label{
    font-size:30px;
    font-weight:800;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  .value{
    font-size:50px;
    font-weight:950;
    color:var(--text);
    text-align:right;
  }

  .sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important }
  }

  @media (max-width:1200px){
    html,body{ width:100%; height:100% }
  }
</style>
</head>

<body>
<main role="main" aria-label="Current weather for Crescent City, California">

  <section class="header">
    <div class="location">Crescent City</div>
    <div class="sub">Current Weather</div>
  </section>

  <section class="current" aria-live="polite">
    <div id="weatherIcon" class="weather-icon" aria-hidden="true"></div>
    <div id="temp" class="temp">--°</div>
    <div id="condition" class="condition">Loading weather…</div>
  </section>

  <section class="details" aria-label="Weather details">
    <div class="card">
      <div class="label">High / Low</div>
      <div id="highLow" class="value">--° / --°</div>
    </div>

    <div class="card">
      <div class="label">Wind</div>
      <div id="wind" class="value">--</div>
    </div>

    <div class="card">
      <div class="label">Rain Chance</div>
      <div id="rain" class="value">--%</div>
    </div>

    <div class="card">
      <div class="label">Humidity</div>
      <div id="humidity" class="value">--%</div>
    </div>
  </section>

  <div id="status" class="sr-only" aria-live="polite">Weather loading</div>
</main>

<script>
(() => {
  const POINTS_URL = "https://api.weather.gov/points/41.7558,-124.2026";
  const STATION_ID = "KCEC";
  const OBS_URL = `https://api.weather.gov/stations/${STATION_ID}/observations/latest`;

  const iconEl = document.getElementById("weatherIcon");
  const tempEl = document.getElementById("temp");
  const conditionEl = document.getElementById("condition");
  const highLowEl = document.getElementById("highLow");
  const windEl = document.getElementById("wind");
  const rainEl = document.getElementById("rain");
  const humidityEl = document.getElementById("humidity");
  const statusEl = document.getElementById("status");

  function cToF(c){
    return Math.round((c * 9 / 5) + 32);
  }

  function knotsToMph(knots){
    return Math.round(knots * 1.15078);
  }

  function compassFromDegrees(deg){
    if(deg === null || deg === undefined || Number.isNaN(Number(deg))) return "";
    const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
    return dirs[Math.round(Number(deg) / 22.5) % 16];
  }

  function getWindFromMetar(rawMessage){
    const match = (rawMessage || "").match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT\b/);
    if(!match) return null;

    const dir = match[1] === "VRB" ? "Variable" : compassFromDegrees(Number(match[1]));
    const speedMph = knotsToMph(Number(match[2]));
    const gustMph = match[3] ? knotsToMph(Number(match[3])) : null;

    if(gustMph !== null){
      return `${dir} ${speedMph} MPH G${gustMph}`;
    }

    return `${dir} ${speedMph} MPH`;
  }

  function getWindFromObservation(observation){
    const metarWind = getWindFromMetar(observation.rawMessage);
    if(metarWind) return metarWind;

    const value = observation.windSpeed?.value;
    if(value === null || value === undefined) return null;

    const unit = observation.windSpeed?.unitCode || "";
    let mph;

    if(unit.includes("km_h")){
      mph = Math.round(value * 0.621371);
    }else if(unit.includes("m_s")){
      mph = Math.round(value * 2.23694);
    }else{
      mph = Math.round(value);
    }

    const dir = compassFromDegrees(observation.windDirection?.value);
    return dir ? `${dir} ${mph} MPH` : `${mph} MPH`;
  }

  function normalizeCondition(observation, fallback){
    const raw = observation.rawMessage || "";
    const text = observation.textDescription || fallback || "Weather unavailable";

    if(/\bOVC\d{3}\b/.test(raw)) return "Overcast";
    if(/\bBKN\d{3}\b/.test(raw) && text.toLowerCase() === "cloudy") return "Mostly Cloudy";
    if(/\bSCT\d{3}\b/.test(raw) && text.toLowerCase() === "cloudy") return "Partly Cloudy";
    if(/\b(FEW|CLR|SKC)\d{0,3}\b/.test(raw) && text.toLowerCase() === "cloudy") return "Clear";

    return text;
  }

  function iconSvg(type){
    const cloud = `
      <path d="M130 260h260c57 0 104-46 104-103 0-56-44-101-100-103-20-58-75-98-139-98-74 0-136 52-151 122-52 9-91 55-91 109 0 33 15 63 38 83 22-7 48-10 79-10z"
        fill="none" stroke="rgba(255,255,255,.92)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>`;

    if(type === "sunny"){
      return `
      <svg viewBox="-35 -35 590 590" role="img" aria-label="Sunny">
        <circle cx="260" cy="260" r="86" fill="none" stroke="var(--yellow)" stroke-width="20"/>
        <g stroke="var(--yellow)" stroke-width="18" stroke-linecap="round">
          <path d="M260 52v60M260 408v60M52 260h60M408 260h60"/>
          <path d="M113 113l43 43M364 364l43 43M407 113l-43 43M156 364l-43 43"/>
        </g>
      </svg>`;
    }

    if(type === "partly"){
      return `
      <svg viewBox="-35 -35 590 590" role="img" aria-label="Partly cloudy">
        <circle cx="206" cy="170" r="70" fill="none" stroke="var(--yellow)" stroke-width="18"/>
        <g stroke="var(--yellow)" stroke-width="14" stroke-linecap="round">
          <path d="M206 54v42M206 244v42M90 170h42M280 170h42"/>
          <path d="M124 88l30 30M258 222l30 30M288 88l-30 30M154 222l-30 30"/>
        </g>
        ${cloud}
      </svg>`;
    }

    if(type === "rain"){
      return `
      <svg viewBox="-35 -35 590 590" role="img" aria-label="Rain">
        ${cloud}
        <g stroke="var(--cyan)" stroke-width="18" stroke-linecap="round">
          <path d="M180 330l-34 72M260 330l-34 72M340 330l-34 72"/>
        </g>
      </svg>`;
    }

    if(type === "storm"){
      return `
      <svg viewBox="-35 -35 590 590" role="img" aria-label="Thunderstorm">
        ${cloud}
        <path d="M265 315l-45 95h62l-27 82 92-120h-66l42-57z"
          fill="var(--danger)"/>
      </svg>`;
    }

    if(type === "snow"){
      return `
      <svg viewBox="-35 -35 590 590" role="img" aria-label="Snow">
        ${cloud}
        <g stroke="var(--snow)" stroke-width="16" stroke-linecap="round">
          <path d="M180 370h70M215 335v70M190 345l50 50M240 345l-50 50"/>
          <path d="M300 390h70M335 355v70M310 365l50 50M360 365l-50 50"/>
        </g>
      </svg>`;
    }

    if(type === "fog"){
      return `
      <svg viewBox="-35 -35 590 590" role="img" aria-label="Fog">
        ${cloud}
        <g stroke="rgba(255,255,255,.72)" stroke-width="16" stroke-linecap="round">
          <path d="M100 350h320M70 400h380M120 450h280"/>
        </g>
      </svg>`;
    }

    if(type === "wind"){
      return `
      <svg viewBox="-35 -35 590 590" role="img" aria-label="Wind">
        <g fill="none" stroke="rgba(255,255,255,.92)" stroke-width="20" stroke-linecap="round">
          <path d="M80 170h260c44 0 44-66 0-66-24 0-36 16-39 32"/>
          <path d="M80 250h330c52 0 52-78 0-78-28 0-42 18-46 38"/>
          <path d="M80 330h230c44 0 44 66 0 66-24 0-36-16-39-32"/>
        </g>
      </svg>`;
    }

    if(type === "night"){
      return `
      <svg viewBox="-35 -35 590 590" role="img" aria-label="Clear night">
        <path d="M332 88c-80 24-139 98-139 185 0 74 42 138 104 171-14 3-28 5-43 5-107 0-194-87-194-194 0-97 71-177 164-192 35-6 73 3 108 25z"
          fill="none" stroke="var(--yellow)" stroke-width="20" stroke-linejoin="round"/>
      </svg>`;
    }

    return `
    <svg viewBox="-35 -35 590 590" role="img" aria-label="Cloudy">
      ${cloud}
    </svg>`;
  }

  function getIconType(text){
    const c = (text || "").toLowerCase();

    if(c.includes("thunder") || c.includes("storm")) return "storm";
    if(c.includes("snow") || c.includes("sleet") || c.includes("ice")) return "snow";
    if(c.includes("rain") || c.includes("drizzle") || c.includes("shower")) return "rain";
    if(c.includes("fog") || c.includes("mist") || c.includes("haze") || c.includes("smoke")) return "fog";
    if(c.includes("wind")) return "wind";
    if(c.includes("overcast") || c.includes("cloudy")) return "cloudy";
    if(c.includes("partly") || c.includes("mostly sunny") || c.includes("partly sunny")) return "partly";
    if(c.includes("clear") && c.includes("night")) return "night";
    if(c.includes("clear") || c.includes("sunny")) return "sunny";

    return "cloudy";
  }

  function getRainChance(period){
    return period?.probabilityOfPrecipitation?.value ?? 0;
  }

  async function loadWeather(){
    try{
      const pointRes = await fetch(POINTS_URL, {
        headers:{ "Accept":"application/geo+json" }
      });

      if(!pointRes.ok) throw new Error("NWS point lookup failed");

      const pointData = await pointRes.json();

      const [forecastRes, hourlyRes, obsRes] = await Promise.all([
        fetch(pointData.properties.forecast, { headers:{ "Accept":"application/geo+json" } }),
        fetch(pointData.properties.forecastHourly, { headers:{ "Accept":"application/geo+json" } }),
        fetch(OBS_URL, { headers:{ "Accept":"application/geo+json" } })
      ]);

      if(!forecastRes.ok || !hourlyRes.ok || !obsRes.ok){
        throw new Error("NWS weather request failed");
      }

      const forecastData = await forecastRes.json();
      const hourlyData = await hourlyRes.json();
      const obsData = await obsRes.json();

      const currentForecast = hourlyData.properties.periods[0];
      const observation = obsData.properties;
      const forecastPeriods = forecastData.properties.periods;

      const todayDay = forecastPeriods.find(p => p.isDaytime) || forecastPeriods[0];
      const tonight = forecastPeriods.find(p => !p.isDaytime) || forecastPeriods[1];

      const observedTempC = observation.temperature?.value;
      const currentTemp = observedTempC !== null && observedTempC !== undefined
        ? cToF(observedTempC)
        : Math.round(currentForecast.temperature);

      const condition = normalizeCondition(
        observation,
        currentForecast.shortForecast
      );

      tempEl.textContent = `${currentTemp}°`;
      conditionEl.textContent = condition;
      iconEl.innerHTML = iconSvg(getIconType(condition));

      const high = todayDay?.temperature;
      const low = tonight?.temperature;
      highLowEl.textContent =
        high !== undefined && low !== undefined ? `${high}° / ${low}°` : "--° / --°";

      windEl.textContent = getWindFromObservation(observation)
        || currentForecast.windSpeed
        || todayDay.windSpeed
        || "--";

      const rainChance =
        getRainChance(currentForecast) ||
        getRainChance(todayDay);

      rainEl.textContent = `${rainChance}%`;

      const humidity = observation.relativeHumidity?.value;
      humidityEl.textContent =
        humidity !== null && humidity !== undefined
          ? `${Math.floor(humidity)}%`
          : "--%";

      statusEl.textContent =
        `Current weather in Crescent City from station ${STATION_ID}: ${currentTemp} degrees and ${condition}`;
    }catch(error){
      console.error(error);

      iconEl.innerHTML = iconSvg("cloudy");
      tempEl.textContent = "--°";
      conditionEl.textContent = "Weather unavailable";
      highLowEl.textContent = "--° / --°";
      windEl.textContent = "--";
      rainEl.textContent = "--%";
      humidityEl.textContent = "--%";
      statusEl.textContent = "Weather unavailable";
    }
  }

  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
})();
</script>
</body>
</html>
